<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - Itahari Model School</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans flex flex-col min-h-screen">

    <header class="bg-blue-900 text-white sticky top-0 z-50 shadow-md">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <img src="images/Logo.jpg" alt="Logo" class="w-10 h-10 object-contain rounded-full bg-white shadow">
                <span class="text-xl font-bold tracking-wide">Itahari Model School</span>
            </div>
            <nav class="hidden md:flex space-x-6 text-sm font-medium">
                <a href="index.html" class="hover:text-blue-200 transition">Home</a>
                <a href="index.html#about" class="hover:text-blue-200 transition">About</a>
                <a href="index.html#academics" class="hover:text-blue-200 transition">Academics</a>
                <a href="gallery.html" class="text-yellow-400 font-semibold">Gallery</a>
                <a href="index.html#contact" class="hover:text-blue-200 transition">Contact</a>
            </nav>
        </div>
    </header>

    <main class="flex-grow container mx-auto px-6 py-12">
        <h1 class="text-4xl font-bold text-center text-blue-900 mb-2">School Gallery</h1>
        <p class="text-center text-gray-600 mb-10">Look back at our memorable moments throughout the years</p>

        <div class="flex justify-center space-x-3 mb-10">
            <button onclick="filterYear('all')" id="btn-all" class="px-5 py-2 bg-blue-900 text-white rounded-lg font-medium shadow transition">All Years</button>
            <button onclick="filterYear('2026')" id="btn-2026" class="px-5 py-2 bg-gray-200 text-gray-700 hover:bg-gray-300 rounded-lg font-medium transition">2026</button>
            <button onclick="filterYear('2025')" id="btn-2025" class="px-5 py-2 bg-gray-200 text-gray-700 hover:bg-gray-300 rounded-lg font-medium transition">2025</button>
        </div>

        <div id="photo-grid" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>
    </main>

    <footer class="bg-blue-950 text-gray-400 py-6 text-center text-sm mt-12">
        <p>&copy; 2026 Itahari Model School. All rights reserved.</p>
    </footer>

    <script>
        // 🌟 ALL YOU HAVE TO DO IS ADD YOUR IMAGE FILENAMES IN THIS LIST BELOW:
        const schoolPhotos = [
            { year: '2025', file: 'sports.jpg', title: 'Annual Sports Meet' },
            { year: '2025', file: 'IMG_1234.jpg', title: 'Science Exhibition' },
            { year: '2026', file: 'classroom.png', title: 'New Academic Session' }
        ];

        // This automatically renders the photos on the screen
        const grid = document.getElementById('photo-grid');
        schoolPhotos.forEach(photo => {
            const card = document.createElement('div');
            card.className = `gallery-item ${photo.year} bg-white rounded-xl overflow-hidden shadow-md transition duration-300 hover:shadow-xl`;
            
            const badgeColor = photo.year === '2026' ? 'text-blue-900 bg-blue-100' : 'text-green-900 bg-green-100';
            
            card.innerHTML = `
                <img src="images/${photo.year}/${photo.file}" alt="${photo.title}" class="w-full h-52 object-cover">
                <div class="p-4">
                    <span class="text-xs font-bold ${badgeColor} px-2 py-1 rounded-full">${photo.year}</span>
                    <h3 class="text-gray-800 font-semibold mt-2">${photo.title}</h3>
                </div>
            `;
            grid.appendChild(card);
        });

        // Tab Filtering logic
        function filterYear(year) {
            const buttons = ['all', '2026', '2025'];
            buttons.forEach(b => {
                const btn = document.getElementById('btn-' + b);
                btn.className = b === year 
                    ? "px-5 py-2 bg-blue-900 text-white rounded-lg font-medium shadow transition"
                    : "px-5 py-2 bg-gray-200 text-gray-700 hover:bg-gray-300 rounded-lg font-medium transition";
            });

            const items = document.querySelectorAll('.gallery-item');
            items.forEach(item => {
                item.style.display = (year === 'all' || item.classList.contains(year)) ? 'block' : 'none';
            });
        }
    </script>
</body>
</html>
